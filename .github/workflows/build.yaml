name: Build and test

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

jobs:
  build:
    # Shared Jellyfin plugin build (JPRM). Pinned to a commit of jellyfin-meta-plugins.
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@5f6990aa467ae0a6b62c91ad0502e3e1a53117ce

  test:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/test.yaml@5f6990aa467ae0a6b62c91ad0502e3e1a53117ce

  page-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test Jellyfin.Plugin.ProgressSync.Tests/ProgressSyncPage.test.cjs
