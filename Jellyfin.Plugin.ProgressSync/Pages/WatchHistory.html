<div data-role="page" class="page type-interior pluginConfigurationPage withTabs"
     data-controller="__plugin/WatchHistory.js">
    <style>
        #progressSyncWatchHistory {
            --ps-accent: #00a4dc;
            --ps-card: rgba(255, 255, 255, .055);
            --ps-border: rgba(255, 255, 255, .1);
        }

        #progressSyncWatchHistory [hidden] {
            display: none !important;
        }

        #progressSyncWatchHistory .ps-hero {
            padding: 1.5em;
            margin: 0 0 1.25em;
            border: 1px solid var(--ps-border);
            border-radius: 12px;
            background: linear-gradient(120deg, rgba(0, 164, 220, .18), var(--ps-card) 60%);
        }

        #progressSyncWatchHistory .ps-hero h1 {
            margin: 0 0 .35em;
            font-size: 1.8em;
        }

        #progressSyncWatchHistory .ps-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1em;
            margin: 0 0 1.25em;
        }

        #progressSyncWatchHistory .ps-metric,
        #progressSyncWatchHistory .ps-panel,
        #progressSyncWatchHistory .ps-user-card {
            border: 1px solid var(--ps-border);
            border-radius: 10px;
            background: var(--ps-card);
        }

        #progressSyncWatchHistory .ps-metric {
            padding: 1em 1.15em;
        }

        #progressSyncWatchHistory .ps-metric-value {
            display: block;
            color: var(--ps-accent);
            font-size: 1.8em;
            font-weight: 700;
        }

        #progressSyncWatchHistory .ps-panel {
            padding: 1.25em;
        }

        #progressSyncWatchHistory .ps-panel-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: .75em;
            margin-bottom: 1em;
        }

        #progressSyncWatchHistory .ps-panel-header h2 {
            margin: 0;
        }

        #progressSyncWatchHistory .ps-users {
            display: grid;
            gap: .75em;
        }

        #progressSyncWatchHistory .ps-user-card {
            overflow: hidden;
        }

        #progressSyncWatchHistory .ps-user-card[open] {
            border-color: rgba(0, 164, 220, .45);
        }

        #progressSyncWatchHistory .ps-user-summary {
            display: flex;
            align-items: center;
            gap: .85em;
            padding: .85em 1em;
            cursor: pointer;
            list-style: none;
        }

        #progressSyncWatchHistory .ps-user-summary::-webkit-details-marker {
            display: none;
        }

        #progressSyncWatchHistory .ps-user-avatar {
            display: grid;
            width: 2.5em;
            height: 2.5em;
            flex: 0 0 2.5em;
            place-items: center;
            border-radius: 50%;
            background: rgba(0, 164, 220, .2);
            color: var(--ps-accent);
            font-weight: 700;
        }

        #progressSyncWatchHistory .ps-user-name {
            flex: 1;
            font-size: 1.05em;
            font-weight: 600;
        }

        #progressSyncWatchHistory .ps-user-hint,
        #progressSyncWatchHistory .ps-history-empty {
            color: var(--secondary-text-color, #aaa);
            font-size: .9em;
        }

        #progressSyncWatchHistory .ps-history-content {
            padding: 0 1em 1.25em;
        }

        #progressSyncWatchHistory .ps-history-tabs {
            display: flex;
            overflow-x: auto;
            gap: .5em;
            margin-bottom: 1em;
            border-bottom: 1px solid var(--ps-border);
        }

        #progressSyncWatchHistory .ps-history-tab {
            flex: 0 0 auto;
            padding: .7em 1em;
            border: 0;
            border-bottom: 3px solid transparent;
            background: transparent;
            color: var(--secondary-text-color, #aaa);
            cursor: pointer;
            font: inherit;
            white-space: nowrap;
        }

        #progressSyncWatchHistory .ps-history-tab[aria-selected="true"] {
            border-bottom-color: var(--ps-accent);
            color: inherit;
            font-weight: 700;
        }

        #progressSyncWatchHistory .ps-history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 1em;
        }

        #progressSyncWatchHistory .ps-history-card {
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--ps-border);
            border-radius: 9px;
            background: var(--ps-card);
            color: inherit;
            text-decoration: none;
            transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
        }

        #progressSyncWatchHistory .ps-history-card:hover,
        #progressSyncWatchHistory .ps-history-card:focus-visible {
            transform: translateY(-3px);
            border-color: rgba(0, 164, 220, .65);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .22);
            text-decoration: none;
        }

        #progressSyncWatchHistory .ps-history-poster {
            position: relative;
            display: grid;
            overflow: hidden;
            aspect-ratio: 2 / 3;
            place-items: center;
            background: linear-gradient(145deg, rgba(0, 164, 220, .2), rgba(255, 255, 255, .04));
        }

        #progressSyncWatchHistory .ps-history-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #progressSyncWatchHistory .ps-history-placeholder {
            padding: 1em;
            color: var(--secondary-text-color, #aaa);
            font-size: .85em;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
        }

        #progressSyncWatchHistory .ps-history-details {
            display: grid;
            gap: .45em;
            padding: .8em;
        }

        #progressSyncWatchHistory .ps-history-title {
            display: -webkit-box;
            overflow: hidden;
            min-height: 2.8em;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            font-weight: 600;
            line-height: 1.4;
        }

        #progressSyncWatchHistory .ps-history-date {
            color: var(--secondary-text-color, #aaa);
            font-size: .88em;
        }

        #progressSyncWatchHistory .ps-history-progress {
            display: grid;
            gap: .35em;
        }

        #progressSyncWatchHistory .ps-history-progress-track {
            height: .4em;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, .16);
        }

        #progressSyncWatchHistory .ps-history-progress-fill {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: var(--ps-accent);
        }

        #progressSyncWatchHistory .ps-history-progress-label {
            color: var(--secondary-text-color, #aaa);
            font-size: .82em;
        }

        #progressSyncWatchHistory .ps-history-empty {
            grid-column: 1 / -1;
            padding: 1.25em;
            border: 1px dashed var(--ps-border);
            border-radius: 8px;
            color: var(--secondary-text-color, #aaa);
            text-align: center;
        }

        @media (max-width: 600px) {
            #progressSyncWatchHistory .ps-history-content {
                padding-right: .75em;
                padding-left: .75em;
            }

            #progressSyncWatchHistory .ps-history-grid {
                grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
                gap: .7em;
            }
        }
    </style>
    <div id="progressSyncWatchHistory" data-role="content">
        <div class="content-primary">
            <header class="ps-hero">
                <h1>Watch History</h1>
                <p class="fieldDescription">See what everyone has watched and is still watching. Expand a user to browse recent movies, episodes, and in-progress titles.</p>
            </header>
            <div class="ps-metrics" aria-label="Watch history overview">
                <div class="ps-metric">
                    <span id="psHistoryUserCount" class="ps-metric-value">—</span>
                    <span class="fieldDescription">Enabled users</span>
                </div>
                <div class="ps-metric">
                    <span class="ps-metric-value">25</span>
                    <span class="fieldDescription">Items per history tab</span>
                </div>
                <div class="ps-metric">
                    <span class="ps-metric-value">Movies + TV</span>
                    <span class="fieldDescription">Watch history</span>
                </div>
            </div>
            <section class="ps-panel">
                <div class="ps-panel-header">
                    <div>
                        <h2 class="sectionTitle">Recent activity</h2>
                        <div class="fieldDescription">Only items you can access are shown.</div>
                    </div>
                    <button is="emby-button" type="button" class="raised" id="psRefreshHistory">
                        <span>Refresh</span>
                    </button>
                </div>
                <div id="psHistoryStatus" class="fieldDescription" role="status" aria-live="polite"></div>
                <div id="psHistoryUsers" class="ps-users"></div>
            </section>
        </div>
    </div>
</div>
